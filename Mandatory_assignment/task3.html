<!DOCTYPE html>
<html>
<head>
    <title>Form Input Controls Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-width: 600px;
            margin: auto;
        }

        form h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Align items to the start (top in column direction) */
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            width: 100%; /* Ensure label takes full width */
            display: block; /* Make label a block element */
        }


        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="email"],
        .form-group input[type="number"],
        .form-group input[type="date"],
        .form-group input[type="time"],
        .form-group input[type="month"],
        .form-group input[type="datetime-local"],
        .form-group input[type="url"],
        .form-group input[type="search"],
        .form-group select,
        .form-group textarea {
            width: 100%; /* Make inputs take full width of their container */
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Include padding and border in element's total width and height */
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input[type="radio"] {
            margin: 0; /* Remove default margin to have better control */
        }

        .form-group .radio-group {
            display: flex;
            align-items: center; /* Vertically center items */
        }

        .form-group .radio-group label {
            margin-left: 5px; /* Add spacing between radio button and label */
            margin-right: 10px;
            font-weight: normal; /* Reset font-weight if needed */
             /* Add background color to label */
        }


        .form-group input[type="checkbox"] {
            margin: 0; /* Remove default margin */
        }

        .form-group .checkbox-group {
              display: flex;
              align-items: center;
             
        }

        .form-group .checkbox-group label{
            margin-left: 5px;
            margin-right: 10px;
            font-weight: normal;
        }

        .form-group input[type="submit"] {
            background-color:grey;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            align-self: center; /* Center the submit button */
        }

        .form-group input[type="submit"]:hover {
            background-color: grey;
        }

        /* Adjust label alignment for side-by-side inputs */
        .side-by-side-inputs {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .side-by-side-inputs .form-group {
            width: 48%; /* Adjust as needed, considering potential gap */
            margin-bottom: 0; /* Remove bottom margin for side-by-side */
        }
       .range-group{
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          width: 100%;
          
        }
        .range-group input[type="range"]{
           width: 100%;
        }
    </style>
</head>
<body>

    <form>
        <h2>Form Input Controls Example</h2>

        <div class="side-by-side-inputs">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>
        <div class="side-by-side-inputs">
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" value="18">
            </div>
            <div class="form-group range-group">
                <label for="rating">Rating:</label>
                <input type="range" id="rating" name="rating" min="0" max="10">
            </div>
             <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" value="2000-01-01">
            </div>
        </div>

        <div class="side-by-side-inputs">

            <div class="form-group">
                <label for="week">Week:</label>
                <input type="week" id="week" name="week">
            </div>
            <div class="form-group">
                 <label for="time">Time:</label>
                 <input type="time" id="time" name="time" value="12:00">
            </div>
            <div class="form-group">
                <label for="image">Image:</label>
                <input type="file" id="image" name="image">
            </div>
        </div>
        <div class="form-group">
            <label for="month">Month:</label>
            <input type="month" id="month" name="month">
        </div>

        <div class="form-group">
            <label for="datetime-local">Datetime-Local:</label>
            <input type="datetime-local" id="datetime-local" name="datetime-local">
        </div>

        <div class="form-group">
            <label for="url">URL:</label>
            <input type="url" id="url" name="url">
        </div>

        <div class="form-group">
            <label for="search">Search:</label>
            <input type="search" id="search" name="search">
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="male" checked>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
        </div>

        <div class="form-group">
            <label>Interests:</label>
             <div class="checkbox-group">
                <input type="checkbox" id="reading" name="interests" value="reading" checked>
                <label for="reading">Reading</label>
                <input type="checkbox" id="sports" name="interests" value="sports">
                <label for="sports">Sports</label>
             </div>
        </div>
        <div class="form-group">
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="usa" selected>United States</option>
                <option value="canada">Canada</option>
                <option value="uk">United Kingdom</option>
                </select>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Enter your message"></textarea>
        </div>

        <div class="form-group">
            <input type="submit" value="Submit">
        </div>
    </form>

</body>
</html>
