<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flipkart Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="left-panel">
      <h2>Login</h2>
      <p>Get access to your Orders,<br>Wishlist and Recommendations</p>
      <img src="https://img.icons8.com/ios-filled/100/ffffff/laptop.png" alt="Login Illustration">
    </div>
    <div class="right-panel">
      <input type="text" placeholder="Enter Email/Mobile number">
      <p class="terms">
        By continuing, you agree to Flipkart's 
        <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>
      </p>
      <button>Request OTP</button>
      <p class="signup">New to Flipkart? <a href="#">Create an account</a></p>
    </div>
  </div>
</body>
</html>
