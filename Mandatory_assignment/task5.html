<!DOCTYPE html>
<html>
<head>
  <title>Flexbox Properties</title>
  <style>
    body {
      background-color: white;
      font-family: Arial, sans-serif;
    }

    h3 {
      margin-left: 20px;
    }

    .outer {
      width: 100%;
      background: linear-gradient(to right, violet, purple);
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }

    .inner {
      width: 120px;
      height: 150px;
      background: linear-gradient(orange, yellow);
      border: 2px solid black;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: flex-start;
      flex-wrap: nowrap;
      margin: 10px;
    }

    .box {
      width: 30px;
      height: 30px;
      background: linear-gradient(blue, cyan);
      font-size: 10px;
      color: white;
      margin: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* For second row */
    .second-row {
      display: flex;
      justify-content: space-evenly;
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="outer">
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>
    <div class="inner">
      <div class="box">Box1</div>
      <div class="box">Box2</div>
      <div class="box">Box3</div>
    </div>

    <div class="second-row">
      <div class="inner">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
      </div>
      <div class="inner">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
      </div>
      <div class="inner">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
      </div>
      <div class="inner">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
      </div>
    </div>
  </div>

</body>
</html>
