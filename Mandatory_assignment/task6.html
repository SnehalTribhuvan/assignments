<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Layout using CSS Grid</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-areas: 
        "header header"
        "sidebar main"
        "footer footer";
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    header {
      grid-area: header;
      background-color: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    aside {
      grid-area: sidebar;
      background-color: #f4f4f4;
      padding: 20px;
    }

    main {
      grid-area: main;
      padding: 20px;
    }

    footer {
      grid-area: footer;
      background-color: #111;
      color: white;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>Header</header>
    <aside>
      <strong>Sidebar</strong><br>
      The Menu or quick access content.
    </aside>
    <main>
      <strong>Main Content</strong><br>
      The core website content should be displayed here.
    </main>
    <footer>Footer</footer>
  </div>

</body>
</html>
